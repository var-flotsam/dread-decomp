# The real build check (tools/check.py --update) on the owner's own PC, where the game dump and the
# toolchain live. GitHub's hosted runners cannot run it: it needs orig/2.1.0, which never leaves the
# owner's machines (CLAUDE.md hard rules), so this job targets a self-hosted runner.
#
# Inert until the repository variable SELF_HOSTED_CHECK is set to 'true' (GitHub: Settings > Secrets
# and variables > Actions > Variables > New repository variable). Until then every run is skipped.
# Make this job a required status check (Settings > Branches > branch protection rules for main)
# only AFTER that variable is set and a run has gone green, or every pull request would wait on a
# job that never runs.
#
# Registering the runner (once, on the PC that holds the dump): GitHub: Settings > Actions > Runners
# > New self-hosted runner, pick Windows, and run the printed download/config commands in a folder
# outside this repository (for example %USERPROFILE%\actions-runner); install it as a service so it
# survives reboots. Git for Windows must be installed (actions/checkout and the bash steps use it).
# The runner checks the repository out into its own work folder. Let the first job create that
# checkout (it fails at the orig/2.1.0 test; actions/checkout deletes the contents of a folder it
# did not create, junction links included), then give the checkout by hand:
#   - orig/2.1.0            the dump as tools/setup.py lays it out (a directory junction to the owner's
#                           copy is fine: `mklink /J orig <path-to-your-clone>\orig`);
#   - build/recon/2.1.0     tools/recon/run.py output (asmdiff reads main_eh_functions.json from it;
#                           a junction to the owner's build/recon works too);
#   - the toolchain cache   %LOCALAPPDATA%\dread-decomp (tools/fetch_toolchains.py), under the account
#                           the runner service runs as;
#   - a Python environment  with the repo's deps (lz4, capstone, pyelftools). DREAD_PYTHON names its
#                           interpreter and defaults to .venv/Scripts/python under the checkout; set it
#                           in the runner's .env file (<runner folder>\.env, one KEY=value per line,
#                           restart the service) to reuse the owner's clone's .venv, for example
#                           DREAD_PYTHON=C:\path\to\your\clone\.venv\Scripts\python.exe
# The checkout below runs with clean: false so those gitignored directories (and junctions) survive
# between runs; never set clean: true here, `git clean -x` would follow the junctions.
#
# Never add upload-artifact, upload-pages or any log-shipping step to this job. build/ and orig/ on
# the runner hold game-derived data, and the hard rules forbid publishing it. Only check.py's own
# status lines (function addresses, names, percentages) reach the Actions log.
#
# Pull requests from forks never run here. The job executes the pull request's own tools/check.py,
# CMake files and Python on the PC that holds orig/ (the dump) and sits next to the keys, which is
# the hazard GitHub documents for self-hosted runners, so the job condition also requires the head
# repository to be this repository (github.event.pull_request.head.repo.full_name == github.repository).
# A fork's pull request then shows this job as skipped, which branch protection counts as passing even
# when the job is required: run tools/check.py locally on a fork's branch before merging it, and the
# push run on main covers the merge itself. Keep "Require approval for all outside collaborators"
# (Settings > Actions > General) on as the second guard for the hosted policy workflow.

name: check (self-hosted)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Skipped (reported as passing) unless the repository variable is set and the code under test is this
    # repository's own: a pull request from a fork never reaches the self-hosted runner (see the header).
    if: vars.SELF_HOSTED_CHECK == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          clean: false
      # Windows PowerShell, which every Windows runner has; Git for Windows puts only Git\cmd on
      # PATH, so `shell: bash` is not available unless the runner is started with Git\bin on PATH.
      - name: Toolchain and dump present
        shell: powershell
        run: |
          $py = if ($env:DREAD_PYTHON) { $env:DREAD_PYTHON } else { '.venv\Scripts\python.exe' }
          Write-Output "python: $py (exists: $(Test-Path $py))"
          Write-Output "LOCALAPPDATA=$env:LOCALAPPDATA  USERPROFILE=$env:USERPROFILE"
          $script = @'
          import sys
          sys.path.insert(0, "tools")
          import buildcfg, fetch_toolchains, hostenv
          from pathlib import Path
          items = {"clang++": fetch_toolchains.clang_path(buildcfg.COMPILER), "libc++ headers": buildcfg.libcxx_include(),
                   "llvm-cxxfilt": Path(hostenv.cxxfilt()), "orig/2.1.0/main.elf": Path("orig/2.1.0/main.elf"),
                   "build/recon/2.1.0": Path("build/recon/2.1.0/main_eh_functions.json")}
          missing = [k for k, p in items.items() if not p.exists()]
          for k, p in items.items():
              print(f"{k}: {p} ({'ok' if p.exists() else 'MISSING'})")
          sys.exit(1 if missing else 0)
          '@
          $script | & $py -
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::a toolchain path or the dump is missing in the runner's environment; see the lines above and the header of this workflow"
            exit 1
          }
      - name: Build check (tools/check.py --update)
        shell: powershell
        run: |
          $py = if ($env:DREAD_PYTHON) { $env:DREAD_PYTHON } else { '.venv\Scripts\python.exe' }
          $log = Join-Path $env:RUNNER_TEMP 'check.log'
          cmd /c "`"$py`" tools/check.py --version 2.1.0 --update > `"$log`" 2>&1"
          $rc = $LASTEXITCODE
          Get-Content $log
          $bad = @(Select-String -Path $log -Pattern '^BUILD FAILED |REGRESSION \(was O\)$|^DUPLICATE ').Count
          Remove-Item $log -ErrorAction SilentlyContinue
          if ($bad -ne 0) {
            Write-Output "::error::tools/check.py printed $bad BUILD FAILED / REGRESSION / DUPLICATE lines (see above)"
            exit 1
          }
          exit $rc
      - name: Committed statuses match (data/functions)
        shell: powershell
        run: |
          git diff --stat --exit-code -- data/functions
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::data/functions/ differs from what check.py --update derives; run it locally and commit the CSVs"
            exit 1
          }
