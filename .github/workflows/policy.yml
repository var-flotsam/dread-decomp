# Content policy (CONTRIBUTING.md, "Rules") on every pull request and push to main.
# Runs without game data, so it can't build or match code: that is checked locally with
# tools/check.py. Read-only token; no secrets are used.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Content policy (whole tree)
        run: python tools/policy_check.py
      - name: Content policy (changed files)
        if: github.event_name == 'pull_request'
        run: python tools/policy_check.py --base "origin/${{ github.base_ref }}"
      # Hand-written sources must not add fn_/g_unk_ declarations that conflict with existing ones:
      # the conflicting-signature counts may not grow vs the base branch, and no symbol that include/
      # declares may gain a local prototype (tools/decl_check.py; CONTRIBUTING.md rule 7). One more
      # identical local copy only warns; add --strict here to reject those too.
      - name: Declaration consistency (vs base branch)
        if: github.event_name == 'pull_request'
        run: python tools/decl_check.py --base "origin/${{ github.base_ref }}"
      - name: Python tools compile
        run: python -m compileall -q tools
      - name: Command index current (docs/commands.md)
        run: python tools/gen_commands.py --check
      # The README's status card (tools/status_card.py) for this commit, in the job summary; on a pull
      # request with what the change does to the whole binary. Tracked files only, never fails the job.
      - name: Status card (job summary)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then base="--base=origin/$BASE_REF"; else base=""; fi
          python tools/status_card.py --summary "$GITHUB_STEP_SUMMARY" $base || echo "::warning::status card failed"
