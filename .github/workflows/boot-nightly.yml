# Boot distance, nightly: builds the port's Linux executable on the owner's PC and runs it
# (tools/boot_distance.py), failing when the boot no longer reaches the milestone in --expect below.
# It needs the dump (orig/2.1.0), which never leaves the owner's machines, so it runs on the same
# self-hosted runner as check-local.yml; read that file's header for how the runner is set up.
#
# Inert until the repository variable SELF_HOSTED_CHECK is 'true', like check-local.yml. It runs on a
# schedule and by hand (workflow_dispatch), never on pull requests: a pull request's own code never
# reaches this job.
#
# The runner's checkout needs, besides check-local.yml's junctions (orig, build\recon), directory
# junctions to the owner's clone for the link's read-only inputs; port/docker/run.sh mounts each one
# read-only, since Docker does not follow a junction inside the build/ mount:
#   - build\ghidra_export   tools/ghidra/analyze.py output (tools/port_link.py's call graph);
#   - build\port\lifted_all14   the lift set the boot runs: tools/port_lift.py's whole-binary output,
#                           lifter round 10 (#310), where the lifter is frozen (docs/HANDOFF.md). The job
#                           links LIFTED below, never the default build\port\lifted: a smaller set left
#                           the static initialisers' first functions unlifted, so they trapped and the
#                           boot faulted right after static init (2026-11-06);
#   - build\cache           the tools' download cache inside the container, with libc++ 9.0.1's
#                           headers (port/docker/run.sh python3 tools/fetch_sources.py libcxx-9.0.1.src).
# build\check, which tools/port_addresses.py reads, is check-local.yml's own output in the same
# checkout; without it the boot stops in nninitStartup (tools/boot_distance.py's build step). The job
# refreshes it with check.py --compile-only first: port_addresses.py rebuilds any object older than
# its source, inside the container, where the project's Clang 9 is not installed, so a checkout newer
# than the last check run failed the addresses step.
# Docker Desktop must be running in the session the runner runs in (the runner is the signed-in
# user's, check-local.yml). The images are rebuilt from port/docker and port/docker/vulkan first
# (cached; the base needs gdb, the Vulkan one lavapipe for --nvn, the NVN shim the boot runs with).
#
# Never add upload-artifact, upload-pages or any log-shipping step to this job. build/boot/ holds the
# run's output and the executable linked against the dump; only boot_distance.py's own lines
# (milestones, counts, addresses) reach the Actions log.
#
# Raise --expect when the boot reaches a further milestone (MILESTONES in tools/boot_distance.py).

name: boot distance (self-hosted, nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-nightly
  cancel-in-progress: false

jobs:
  boot:
    name: boot distance
    if: vars.SELF_HOSTED_CHECK == 'true'
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      LIFTED: build\port\lifted_all14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          clean: false
      - name: Dump, inputs and Docker present
        shell: powershell
        run: |
          $missing = @()
          foreach ($p in 'orig\2.1.0\exefs\main', 'build\ghidra_export\2.1.0\main_functions.jsonl', 'build\check\2.1.0',
                         "$env:LIFTED\manifest.json", 'build\cache') {
            $ok = Test-Path $p
            Write-Output "${p}: $(if ($ok) { 'ok' } else { 'MISSING' })"
            if (-not $ok) { $missing += $p }
          }
          docker version --format 'docker: client {{.Client.Version}}, server {{.Server.Version}}'
          if ($LASTEXITCODE -ne 0) { $missing += 'docker' }
          if ($missing.Count -ne 0) {
            Write-Output "::error::missing in the runner's checkout or environment: $($missing -join ', '); see this workflow's header"
            exit 1
          }
      - name: Build images
        shell: powershell
        run: |
          docker build -q -t dread-port-linux port/docker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker build -q -t dread-port-linux-vulkan port/docker/vulkan
          exit $LASTEXITCODE
      - name: Refresh build\check
        shell: powershell
        run: |
          $py = if ($env:DREAD_PYTHON) { $env:DREAD_PYTHON } else { '.venv\Scripts\python.exe' }
          & $py tools/check.py --version 2.1.0 --compile-only
          exit $LASTEXITCODE
      - name: Boot distance
        shell: powershell
        run: |
          $py = if ($env:DREAD_PYTHON) { $env:DREAD_PYTHON } else { '.venv\Scripts\python.exe' }
          & $py tools/boot_distance.py --version 2.1.0 --nvn --lifted $env:LIFTED --expect fn_7100015c70
          exit $LASTEXITCODE
